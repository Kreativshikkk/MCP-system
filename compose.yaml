services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mcp_system
      POSTGRES_USER: mcp_system
      POSTGRES_PASSWORD: mcp_system
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_system -d mcp_system"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - mcp_system_postgres18:/var/lib/postgresql

volumes:
  mcp_system_postgres18:
