[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-system"
version = "0.1.0"
description = "Local, persistent and isolated service replicas exposed through MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_system = ["inspector_assets/*.html", "inspector_assets/*.css", "inspector_assets/*.js"]
